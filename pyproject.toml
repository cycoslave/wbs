[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wbs"
version = "6.0.0"
description = "Fast Python-based IRC bot with multiprocessing and botnet support (WBS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "irc>=20.0.0",
  "aiosqlite>=0.19.0",
  "prompt_toolkit>=3.0",
  "bcrypt>=4.0.0",
  "aiohttp>=3.9.0",
  "aiodns>=3.0.0",
  "feedparser>=6.0.10",
  "psutil>=5.9.0",
  "beautifulsoup4>=4.12.0",
  "requests>=2.32.0",
  "whoisit>=2.8",
  "ipinfo>=4.0.0",
  "pyasn>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[project.scripts]
wbs = "main:main"         # ./wbs entrypoint

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src"]
